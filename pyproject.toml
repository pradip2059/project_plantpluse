[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="plantpulse-testbench"
version="1.0.0"
description="Hardware-agnostic commissioning, fault-injection, and validation CLI for embedded and industrial systems"
readme="README.md"
requires-python=">=3.10"
dependencies=["typer>=0.12","rich>=13","PyYAML>=6","pyserial>=3.5","pymodbus>=3.7"]
[project.optional-dependencies]
dev=["pytest>=8"]
[project.scripts]
plantpulse="plantpulse.cli:app"
[tool.setuptools.packages.find]
include=["plantpulse*"]
